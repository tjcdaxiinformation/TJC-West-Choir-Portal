        // 渲染左側名冊
        function renderChoirList(data) {
            const listContainer = document.getElementById('choir-list');
            if (!listContainer) return;
            
            listContainer.innerHTML = '';
            data.forEach(c => {
                const isActive = activeChoirId === c.id;
                const statusBadge = c.status === 'submitted' 
                    ? '<span class="text-[9px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">已上傳</span>' 
                    : '<span class="text-[9px] bg-slate-100 text-slate-400 px-2 py-0.5 rounded-full font-bold">待上傳</span>';

                const card = document.createElement('button');
                card.className = `w-full text-left p-4 rounded-2xl transition-all border flex items-center justify-between group ${isActive ? 'bg-indigo-50 border-indigo-400 shadow-sm' : 'bg-white border-slate-100 hover:border-slate-200'}`;
                card.onclick = () => selectChoir(c.id);
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-1.5 w-2.5 h-2.5 rounded-full shrink-0 ${getZoneColor(c.zone)}"></div>
                        <div>
                            <div class="text-sm font-black text-slate-800 leading-snug">${c.name}</div>
                            <div class="text-[10px] text-slate-400 font-bold mt-0.5 flex items-center gap-2">
                                <span>${c.zone} · ${c.note}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${statusBadge}
                        <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function getZoneColor(zone) {
            if (zone === "復興小區") return "bg-amber-500";
            if (zone === "竹苗小區") return "bg-emerald-500";
            if (zone === "中苗小區") return "bg-purple-500";
            if (zone === "南投小區") return "bg-rose-500";
            return "bg-indigo-500";
        }

        function filterChoirs() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = choirs.filter(c => 
                c.name.toLowerCase().includes(term) || 
                c.zone.toLowerCase().includes(term) || 
                c.conductor.toLowerCase().includes(term) ||
                c.leader.toLowerCase().includes(term)
            );
            renderChoirList(filtered);
        }

                <div class="mt-8 pt-5 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                    <button onclick="submitDemo('${targetUrl}')" class="w-full md:flex-grow bg-slate-900 text-white py-4 px-6 rounded-2xl font-black text-xs hover:bg-indigo-600 transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95">
                        <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                        開啟專屬雲端直接上傳
                    </button>
                    ${!isSubmitted ? `
                        <button onclick="confirmUpload(${choir.id})" class="w-full md:w-auto bg-emerald-600 text-white py-4 px-8 rounded-2xl font-black text-xs hover:bg-emerald-500 transition-all shadow-md active:scale-95 shrink-0">
                            確認已完成上傳
                        </button>
                    ` : `
                        <div class="w-full md:w-auto flex items-center justify-center gap-3 bg-rose-50 border border-rose-100 px-8 py-3.5 rounded-2xl shrink-0 shadow-sm animate-bounce">
                            <span class="text-rose-500 text-3xl animate-pulse">❤️</span>
                            <span class="text-sm font-black text-rose-700 tracking-wider">感謝主！願主紀念帶領。</span>
                        </div>
                    `}
                </div>
            `;
        }

        // 確認已完成上傳 (連動狀態與大愛心顯示)
        function confirmUpload(id) {
            const choir = choirs.find(c => c.id === id);
            if (choir) {
                choir.status = 'submitted';
                selectChoir(id); // 重新繪製詳細面板，觸發「感謝主！❤️」
                updateStats();   // 更新進度看板件數
            }
        }

        // 更新頂部已提交/未提交件數
        function updateStats() {
            const submittedCount = choirs.filter(c => c.status === 'submitted').length;
            const pendingCount = choirs.length - submittedCount;
            document.getElementById('count-submitted').innerText = submittedCount;
            document.getElementById('count-pending').innerText = pendingCount;
        }

        function submitDemo(url) {
            window.open(url, '_blank');
        }

        // 0秒強制解鎖
        const loader = document.getElementById('launch-loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
        }

        // 頁面初始化渲染
        renderChoirList(choirs);
        updateStats();
    </script>
</body>
</html>
